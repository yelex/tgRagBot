services:
  bot:
    build: .
    container_name: tg_rag_bot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_CORP}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_TIMEOUT: ${GIGACHAT_TIMEOUT:-60}
      OPERATOR_CHAT_ID: ${OPERATOR_CHAT_ID}
      FEEDBACK_DELAY_HOURS: ${FEEDBACK_DELAY_HOURS:-2}
      PATH_BOUQUETS: ${PATH_BOUQUETS:-/app/data/bouquets.json}
      PATH_SYSTEM_PROMPT: ${PATH_SYSTEM_PROMPT:-/app/prompts/system_prompt.txt}
      PYTHONUNBUFFERED: "1"
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts
      - ./logs:/app/logs
